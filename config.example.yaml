# Copy this file to config.yaml and fill in your own values.
# config.yaml is gitignored so your tokens never get committed.

yandex:
  enabled: true
  oauth_token: "PASTE_YOUR_OAUTH_TOKEN_HERE"
  device_id: "PASTE_YOUR_DEVICE_ID_HERE"

rgb_strip:
  enabled: true
  mac_address: "AA:BB:CC:DD:EE:FF"
  # Two profiles are supported out of the box, matching the two most common
  # GATT layouts for generic BLE RGB controllers. Use list_ble_services.py
  # to see which one your strip exposes, and send_raw.py to double-check
  # the byte format if picking the matching protocol doesn't work.
  #   - "triones":        service 0000ffd5-..., write char 0000ffd9-...
  #   - "happy_lighting": service 0000fff0-..., write char 0000fff3-...
  protocol: triones
  write_characteristic_uuid: "0000ffd9-0000-1000-8000-00805f9b34fb"
  connect_timeout: 10.0

sync:
  mode: screen               # screen (auto-start ambilight in the GUI) | off (manual control only)
  fps: 15
  color_algorithm: average   # average | dominant
  brightness: 1.0            # 0.0 - 1.0
  gamma: 2.2
  smoothing: 0.3             # 1 = instant (no smoothing), closer to 0 = slower/smoother transitions
  min_change_threshold: 4    # skip sending updates smaller than this (sum of |dr|+|dg|+|db|)
  monitor_index: 1           # 1 = first monitor, per mss numbering
